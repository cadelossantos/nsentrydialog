<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>nsentrydialog — Test Page (UI matched to gantt editor)</title>
  <style>
    body { font-family: -apple-system, 'Segoe UI', Roboto, sans-serif; margin: 24px; background: #f8fafc; color: #0f172a; }
    h1 { font-size: 20px; }
    .status { margin-top: 16px; padding: 12px; border-radius: 8px; background: #eef2ff; border: 1px solid #c7d2fe; white-space: pre-wrap; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 12px; max-height: 320px; overflow: auto; }
    code { background: #e2e8f0; padding: 1px 4px; border-radius: 4px; }
    .btnrow { display: flex; gap: 12px; }
  </style>
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script>
    // Minimal synchronous AMD shim so the NetSuite define([], factory) module
    // loads standalone in this browser harness (empty deps + sync factory).
    (function (win) {
      const modules = {};
      win.define = function (deps, factory) {
        if (typeof deps === 'function') { factory = deps; deps = []; }
        modules['nsentrydialog'] = factory;
      };
      win.require = function (names, cb) {
        if (cb) cb.apply(null, names.map(function (n) { const f = modules[n]; return f ? f() : null; }));
      };
      win.AMD_SHIM = true;
    })(window);
  </script>
  <script src="nsentrydialog.js"></script>
</head>
<body>
  <h1>nsentrydialog — Test (UI matched to nsgantt task editor)</h1>
  <div class="btnrow">
    <button id="openBtn">Open (Edit)</button>
    <button id="viewBtn" class="secondary">Open (View — read-only)</button>
  </div>
  <div class="status" id="status">(not opened yet)</div>

  <script>
    jQuery(document).ready(function () {
      let nsd = null;
      require(['nsentrydialog'], function (m) { nsd = m; });
      if (!nsd) {
        document.getElementById('status').textContent =
          'ERROR: nsentrydialog loaded via define() but require(["nsentrydialog"]) returned nothing (AMD shim?).';
        return;
      }


      const statusEl = document.getElementById('status');

      function logLine(msg, obj) {
        console.log(msg, obj);
	      const txt = statusEl.textContent + '\n' + msg + '\n' + JSON.stringify(obj, null, 2);
        statusEl.textContent = txt.replace(/\n{3,}/g, '\n\n').slice(-4000);
      }

      function open(view) {

	      const workCenters = ['WC-1', 'WC-2', 'WC-3'];
	      const machinesForWorkCenter = {
		      'WC-1': [{ id: 'M-1', text: 'Machine 1' }, { id: 'M-2', text: 'Machine 2' }],
		      'WC-2': [{ id: 'M-3', text: 'Machine 3' }],
		      'WC-3': [{ id: 'M-4', text: 'Machine 4' }, { id: 'M-5', text: 'Machine 5' }, { id: 'M-6', text: 'Machine 6' }]
	      };
	      const locsByRoute = {
		      'A': [{ id: 'A1', text: 'A-1 Dock' }, { id: 'A2', text: 'A-2 Yard' }],
		      'B': [{ id: 'B1', text: 'B-1 Dock' }, { id: 'B2', text: 'B-2 Yard' }, { id: 'B3', text: 'B-3 Depot' }]
	      };
	      const assetPool = [{ id: 'NG-1', text: 'NG-1' }, { id: 'NG-2', text: 'NG-2' }, { id: 'NG-3', text: 'NG-3' }];

	      const formLayout = {
		      columns: 3,
		      view: view,
		      title: view ? 'Test Editor — View' : 'Test Editor',
		      fields: [
			      { name: 'name', label: 'Name', type: 'text', colspan: 3, required: true,
				      defaultValue: (ctx) => ctx.getValue('name') || 'New Operation' },

			      { name: 'qtyInt', label: 'Qty (integer)', type: 'integer', colspan: 1,
				      validate: (value, ctx) => value === '' || Number(value) >= 0 },
			      { name: 'qtyDec', label: 'Qty (decimal)', type: 'decimal', colspan: 1 },
			      { name: 'unitCost', label: 'Unit Cost', type: 'currency', decimalPlaces: 2, colspan: 1,
				      validate: (value, ctx) => value == null || value === '' || Number(value) <= 200 },

			      { name: 'startTime', label: 'Start Time', type: 'time', format: 'hh:mm a', colspan: 1, break: true },
			      { name: 'dueDate', label: 'Due Date', type: 'date', format: 'MM/DD/YYYY', colspan: 1 },
			      { name: 'endAt', label: 'End At', type: 'datetime', format: 'MM-DD-YYYY hh:mm', colspan: 1 },

			      { name: 'locked', label: 'Locked', type: 'checkbox', checkboxLabel: 'Mark locked', colspan: 1, defaultValue: true },
			      { name: 'secretNote', label: 'Shown when locked', type: 'text', colspan: 2,
				      visible: (ctx) => ctx.getValue('locked') === true,
				      required: (ctx) => ctx.getValue('locked') === true },

			      { name: 'priority', label: 'Priority (hint + disabled)', type: 'select', colspan: 1,
				      options: [
					      { id: '1', text: '1-Critical' },
					      { id: '2', text: '2-High', hint: { text: 'Retained beyond 30 days', color: '#b45309', textcolor: '#ffffff' } },
					      { id: '3', text: '3-Medium', disabled: true },
					      { id: '4', text: '4-Low', textcolor: '#b91c1c' }
				      ],
				      onChange: (ctx) => { ctx.setValue('prioNote', 'priority is ' + ctx.getValue('priority')); } },
			      { name: 'prioNote', label: 'Prio Readback', type: 'text', colspan: 2 },

			      { name: 'operators', label: 'Operators (multi — placeholder)', type: 'multi-select', colspan: 2,
				      options: [ { id: 'op1', text: 'Operator 1' }, { id: 'op2', text: 'Operator 2' },
					      { id: 'op3', text: 'Operator 3' } ] },
			      { name: 'bom', label: 'BOM Items (multi — hint)', type: 'multi-select', colspan: 1,
				      options: [ { id: 'raw', text: 'Raw', hint: { text: 'Stock-level check enabled' } },
					      { id: 'sub', text: 'Subassembly' }, { id: 'fin', text: 'Finished' } ] },

			      { name: 'notes', label: 'Notes (textarea)', type: 'textarea', colspan: 3, break: true },

			      { name: 'licenses', label: 'Licenses (max 2)', type: 'checkbox-group', colspan: 3, max: 2,
				      // defaultValue: ['L1', 'L3'],   // sample default: pre-checks L1 + L3 (a data value for this field would win)
				      options: [ { id: 'L1', text: 'License A' }, { id: 'L2', text: 'License B' }, { id: 'L3', text: 'License C' } ] },

			      { name: 'workCenter', label: 'Work Center', type: 'select', colspan: 1, break: true,
				      options: (ctx) => workCenters.map(function (w) { return { id: w, text: w }; }),
				      onChange: (ctx) => { ctx.setValue('machineId', ''); ctx.reloadOptions('machineId'); } },
			      { name: 'machineId', label: 'Machine', type: 'select', colspan: 2,
				      options: (ctx) => (machinesForWorkCenter[ctx.getValue('workCenter')] || []) },

			      { name: 'route', label: 'Route (reloads table column)', type: 'select', colspan: 2, break: true,
				      options: [
					      { id: 'A', text: 'Route A' },
					      { id: 'B', text: 'Route B' }
				      ],
				      onChange: (ctx) => ctx.reloadOptions('loc') },
			      { name: 'lots', label: 'Loads (route-dependent column)', type: 'table', colspan: 3, break: true, allowAdd: true,
				      columns: [
					      { name: 'loc', label: 'Location', type: 'select', width: 160, required: true,
						      options: (ctx) => locsByRoute[ctx.getValue('route')] || [] },
					      { name: 'qty', label: 'Qty', type: 'integer', width: 80, defaultValue: 1 }
				      ],
				      rowInit: () => ({ qty: 1 }) },

			      { name: 'display', label: 'Asset Log (reload empties below)', type: 'select', colspan: 3, break: true,
				      options: [ { id: 'Details', text: 'Details' }, { id: 'Minimal', text: 'Minimal' } ],
				      onChange: (ctx) => { ctx.setValue('assetLog', ctx.getValue('display') === 'Details' ? [{ assetCode: 'NG-1', qty: 1 }] : []); ctx.reloadOptions('assetCode'); } },
			      { name: 'assetLog', label: 'Asset Log (allowAdd:false — empty state on reload)', type: 'table', colspan: 3, break: true, allowAdd: false,
				      columns: [
					      { name: 'assetCode', label: 'Asset', type: 'select', width: 120, required: true,
						      options: (ctx) => assetPool },
					      { name: 'qty', label: 'Qty', type: 'integer', width: 80, defaultValue: 1 }
				      ],
				      rowInit: () => ({ qty: 1 }) },

			      { name: 'deps', label: 'Dependencies (task column + read-only cells)', type: 'table', colspan: 3, break: true, allowAdd: true,
				      columns: [
					      { name: 'id',    label: 'Task',  type: 'select', width: 150,
						      options: [ { id: 'OP-10', text: '10 Op A' }, { id: 'OP-20', text: '20 Op B' },
							      { id: 'OP-30', text: '30 Op C' }, { id: 'OP-90', text: '90 Op D' } ] },
					      { name: 'type',  label: 'Type',  type: 'select', width: 140, required: true, defaultValue: 'FS',
						      options: [ { id: 'SS', text: 'Start-to-Start' }, { id: 'FS', text: 'Finish-to-Start' } ] },
					      { name: 'qty',   label: 'Qty',   type: 'integer', width: 80 },
					      { name: 'cost',  label: 'Cost',  type: 'currency', decimalPlaces: 2, width: 100,
						      validate: (value, ctx) => value == null || value === '' || Number(value) <= 200 },
					      { name: 'due',   label: 'Due',   type: 'date', width: 140 },
					      { name: 'start', label: 'Start', type: 'time', width: 110 },
					      { name: 'note',  label: 'Note',  type: 'textarea' }
				      ],
				      rowInit: (ctx) => ({ qty: 1 }),
				      validateRow: (value, ctx) => { const q = value ? value.qty : null; return q == null || Number(q) >= 1; } },

			      { name: 'flags', label: 'Flags (allowAdd:false — empty state)', type: 'table', colspan: 3, break: true, allowAdd: false,
				      columns: [ { name: 'code', label: 'Code', type: 'text' },
					      { name: 'active', label: 'Active', type: 'checkbox' } ] }
		      ],
		      buttons: [
			      { label: 'OK (Save)', result: 1, primary: true },
			      { label: 'Audit', result: 3, color: '#f59e0b', textColor: '#ffffff' },
			      { label: 'Cancel' }
		      ],
	      };

	      const data = {
		      name: 'Operation 100',
		      qtyInt: 5,
		      qtyDec: 1.5,
		      unitCost: 50,
		      startTime: '14:30',
		      dueDate: '2026-08-15',
		      endAt: '2026-08-15T16:00',
		      locked: true,
		      priority: '2',
		      operators: ['op1', 'op2'],
		      bom: ['raw'],
		      notes: 'First line\nSecond line — this is a multi-line note.',
          licenses: ['L1', 'L3'],
		      workCenter: 'WC-1',
		      machineId: 'M-1',
		      route: 'A',
		      lots: [],
		      display: 'Details',
		      assetLog: [ { assetCode: 'NG-1', qty: 1 } ],
		      deps: [
			      { id: 'OP-90', type: 'FS', qty: 2, cost: 10, due: '2026-08-10', start: '08:00', note: 'initial row' }
		      ],
		      flags: []
	      };

        try {
          nsd.create(
	          formLayout,
            data,
            {
              success: function (result, valueObj) {
                if (result === null) logLine('[NO-SAVE CLOSE] result=' + result + ' valueObj =', valueObj);
                else logLine('[SAVE] result=' + result + ' valueObj =', valueObj);
              },
              failure: function (reason) {
                console.error('nsentrydialog failure:', reason);
                statusEl.textContent += '\nFAILURE: ' + String(reason && reason.message || reason);
              }
            }
          );
        } catch (e) {
          console.error(e);
          statusEl.textContent += '\nEXCEPTION: ' + String(e && e.message || e);
        }
      }

      document.getElementById('openBtn').addEventListener('click', function () { open(false); });
      document.getElementById('viewBtn').addEventListener('click', function () { open(true); });
    });
  </script>
</body>
</html>
